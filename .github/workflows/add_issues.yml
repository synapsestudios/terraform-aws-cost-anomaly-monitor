name: Add issues to project

on:
  issues:
    types:
      - opened

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@021a2405c7f990db57f5eae5397423dcc554159c # v1.7.0
        with:
          app_id: ${{ secrets.SYNOPS_APP_ID }}
          private_key: ${{ secrets.SYNOPS_APP_PRIVATE_KEY }}

      - name: Add to project
        id: add_to_project
        uses: actions/add-to-project@960fbad431afda394cfcf8743445e741acd19e85 # v0.4.0
        with:
          project-url: https://github.com/orgs/synapsestudios/projects/33
          github-token: ${{ steps.generate_token.outputs.token }}
